spring:
  application:
    name: synpharm-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:synpharm}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Fth419516.}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
#      password:
      database: 0
      timeout: 3000ms

  # RabbitMQ（批量任务消息队列；Docker dev compose 通过环境变量注入服务名）
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:synpharm}
    password: ${RABBITMQ_PASSWORD:}

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # 邮件配置（QQ邮箱发送验证码）
  # 部署时通过环境变量 QQ_EMAIL 和 QQ_EMAIL_AUTH_CODE 注入真实值
  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_EMAIL:3086499874@qq.com}
    password: ${QQ_EMAIL_AUTH_CODE:cphjbrgtndkwdhde}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.synpharm.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 开发环境固定密钥（仅本地开发使用，生产环境必须通过 JWT_SECRET 环境变量注入）
  secret: SynPharm-Dev-Secret-Key-2026-Do-Not-Use-In-Production-Env-1234567890
  expiration: 86400000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    # 邮箱为可选功能，未配置时不影响健康状态
    mail:
      enabled: false

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.synpharm: debug
    com.baomidou.mybatisplus: info

# 文件存储目录
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  result-dir: ${FILE_RESULT_DIR:./results}

# FastAPI 算法引擎（Docker dev compose 通过环境变量注入服务名）
fastapi:
  base-url: ${FASTAPI_URL:http://localhost:8000}
  api-key: ${FASTAPI_API_KEY:}
  timeout-single: ${FASTAPI_TIMEOUT_SINGLE:30000}
  timeout-batch: ${FASTAPI_TIMEOUT_BATCH:60000}

# 应用配置
app:
  name: SynPharm
